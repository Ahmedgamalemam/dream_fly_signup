<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dream & Fly</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: Nunito !important;
        overflow-x: hidden;
        background-color: rgba(0, 0, 0, 0.5) !important;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      main {
        background: #ffffff;
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        width: 90%;
        height: 90%;
        border-radius: 20px;
        padding: 14px 28px;
      }

      section {
        width: 50%;
      }

      .background-logo {
        width: 50%;
        height: 100%;
      }

      img {
        width: 100%;
        height: 100%;
      }

      form {
        width: 100%;
      }

      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #eaeaea !important;
        margin-bottom: 0.2rem;
        outline: 0;
        border-radius: 8px;
      }

      input::placeholder {
        color: #cacaca;
      }

      #emailVerificationControl_success_message {
        display: none !important;
      }

      #emailVerificationControl_but_change_claims {
        background: #369be7;
        padding: 0.6rem;
      }

      .error.itemLevel,
      .error {
        margin-bottom: 6px;
      }

      /* /////////////////////////////////fonts//////////////////////////////////////////// */

      @font-face {
        font-family: "Nunito";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/NunitoSans_7pt_Condensed-Regular.ttf")
          format("truetype");
      }

      @font-face {
        font-family: "Urbanist";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/Urbanist-Black.ttf")
          format("truetype");
      }

      /* /////////////////////////////////////////////////////////////////////// */

      p {
        margin: 0 !important;
      }

      .buttons #cancel {
        display: none;
      }
      #attributeList ul li .attrEntry .verificationControlContent .sendCode,
      #emailVerificationControl_but_send_code,
      #attributeList ul li .attrEntry .verify .sendButton {
        padding: 0.6rem;
        color: white;
        width: 100% !important;
        background-color: #369be7 !important;
        border-radius: 0.5rem;
        margin: 1rem 0;
      }

      .buttons {
        display: flex;
        margin-bottom: 1rem;
      }
      .buttons button {
        width: 100%;
        padding: 0.1rem;
        border-radius: 0.5rem;
        color: white;
        border: none;
      }

      .intro p {
        display: none !important;
      }

      #emailVerificationControl_but_send_new_code,
      #emailVerificationControl_but_verify_code {
        background: transparent !important;
        padding: 0.4rem;
        color: #369be7;
      }

      .intro p {
        color: red !important;
        /* margin-top: -20px !important; */
      }

      .error.itemLevel,
      .error {
        color: red !important;
        font-size: 12px;
      }

      #continue {
        width: 100%;
        padding: 0.6rem;
        border-radius: 0.5rem;
        background: #369be7;
        border: none;
      }

      #attributeList ul li label {
        display: none;
      }

      .heading {
        display: none;
      }

      .helpLink,
      #cancel {
        display: none;
      }
      ul {
        padding-left: 0 !important;
      }
      li::marker {
        content: "";
      }

      /* //////////////////////////////////////////////// */
      @media (max-width: 470px) {
        main {
          height: 97%;
        }
        .head-title {
          font-size: 20px;
        }

        .title p {
          font-size: 12px;
        }
      }
      @media (max-width: 840px) {
        main {
          height: 97%;
        }
        section {
          width: 100%;
        }
        .background-logo {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div>
          <h3 class="head-title" style="font-weight: 600">
            Get Started with Dream & Fly
          </h3>
          <p class="title" style="color: 242456">
            Create your account now with your email address to get started.
          </p>
        </div>

        <form id="api" class="w-100" method="post" autocomplete="off">
          <input
            id="givenName"
            name="givenName"
            type="text"
            required
            placeholder="First Name"
          />

          <input
            id="surname"
            name="surname"
            type="text"
            required
            placeholder="Last Name"
          />

          <input
            id="email"
            name="email"
            type="text"
            required
            placeholder="Email Address"
          />

          <input
            id="password"
            name="password"
            type="password"
            required
            placeholder="Password"
          />

          <input
            id="reenterPassword"
            required
            type="password"
            placeholder="Confirm Password"
          />

          <div class="buttons">
            <button id="continue" type="submit" class="bton">Sign Up</button>
          </div>
        </form>
      </section>

      <div class="background-logo">
        <img
          src="https://ahmedgamalemam.github.io/dream_fly_signup/images/light-bg.png"
          alt="logo"
        />
      </div>
    </main>
  </body>
</html>
