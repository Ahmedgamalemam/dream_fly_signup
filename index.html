<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dream & Fly</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: Nunito !important;
        overflow-x: hidden;
        background-color: rgba(0, 0, 0, 0.5) !important;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      main {
        background: #ffffff;
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        width: 90%;
        height: 90%;
        border-radius: 20px;
        padding: 14px 28px;
      }

      section {
        width: 50%;
        height: 97%;
      }

      .background-logo {
        width: 50%;
        height: 100%;
      }

      img {
        width: 100%;
        height: 100%;
      }

      form {
        width: 100%;
      }

      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #eaeaea !important;
        margin-bottom: 0.8rem;
        outline: 0;
        border-radius: 8px;
      }

      input::placeholder {
        color: #cacaca;
      }

      #emailVerificationControl_success_message {
        color: red;
        font-size: 14px;
      }

      /* /////////////////////////////////fonts//////////////////////////////////////////// */

      @font-face {
        font-family: "Nunito";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/NunitoSans_7pt_Condensed-Regular.ttf")
          format("truetype");
      }

      @font-face {
        font-family: "Urbanist";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/Urbanist-Black.ttf")
          format("truetype");
      }

      /* /////////////////////////////////////////////////////////////////////// */

      p {
        margin: 0 !important;
      }

      /* .create {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        margin-top: 5px !important;
      } */
      .buttons #cancel {
        display: none;
      }
      #attributeList ul li .attrEntry .verificationControlContent .sendCode,
      #emailVerificationControl_but_send_code,
      #attributeList ul li .attrEntry .verify .sendButton {
        padding: 0.6rem;
        color: white;
        width: 100% !important;
        background-color: #369be7 !important;
        border-radius: 0.5rem;
        margin: 1rem 0;
      }

      .buttons {
        display: flex;
        margin-bottom: 1rem;
      }
      .buttons button {
        width: 100%;
        padding: 0.1rem;
        border-radius: 0.5rem;
        color: white;
        border: none;
      }

      #emailVerificationControl_but_send_new_code,
      #emailVerificationControl_but_verify_code {
        background: transparent !important;
        padding: 0.4rem;
        color: #369be7;
      }

      .intro p {
        color: red !important;
      }

      .error.itemLevel,
      .error {
        color: red !important;
        font-size: 12px;
      }

      #continue {
        width: 100%;
        padding: 0.6rem;
        border-radius: 0.5rem;
        background: #369be7;
        border: none;
      }

      /* .divider {
        display: none;
      } */

      #attributeList ul li label {
        display: none;
      }

      /* .self_asserted_container .row .panel-default .panel-body img.companyLogo {
        display: none;
      } */

      .heading {
        display: none;
      }
      /* #attributeList input {
        background: #fbfbfb !important;
      } */
      /* /////////////////////////////////////////////////////// */

      /* .background-container {
        position: relative;
        width: 500px;
        height: 300px;
        overflow: hidden;
      } */

      /* ////////////////////////////////////////////////////////////////////// */

      /* .carousel-indicators {
        bottom: -29%;
      }
      .carousel-indicators [data-bs-target] {
        width: 1.5625rem;
        height: 0.375rem;
        background-color: #068fd3;
      }
      .carousel-indicators .active {
        width: 3rem;
        height: 0.375rem;
      } */

      /* /////////////////////////////////////////////////////////////////////// */
      .helpLink,
      #cancel {
        display: none;
      }

      ul {
        padding-left: 0 !important;
      }
      li::marker {
        content: "";
      }
      /* //////////////////////////////////////////////// */
      @media (max-width: 1000px) {
        .main-login > div {
          width: 100%;
          height: 100dvh;
          position: fixed;
          top: 0;
          left: 0;
          border-radius: 0 !important;
        }
      }

      @media (max-width: 500px) {
        .main-login {
          padding: 0rem 3% 0;
        }

        .main-login > div {
          display: none !important;
        }

        .main-login > section {
          width: 100% !important;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div>
          <h3 style="font-weight: 600">Get Started with Dream & Fly</h3>
          <p>Create your account now with your email address to get started.</p>
        </div>

        <form id="api" class="w-100" method="post" autocomplete="off">
          <input
            id="givenName"
            name="givenName"
            type="text"
            required
            placeholder="First Name"
          />

          <input
            id="surname"
            name="surname"
            type="text"
            required
            placeholder="Last Name"
          />

          <input
            id="email"
            name="email"
            type="text"
            required
            placeholder="Email Address"
          />

          <input
            id="password"
            name="password"
            type="password"
            required
            placeholder="Password"
          />

          <input
            id="reenterPassword"
            required
            type="password"
            placeholder="Confirm Password"
          />

          <div class="buttons">
            <button id="continue" type="submit" class="bton">Sign Up</button>
          </div>
        </form>
      </section>

      <div class="background-logo">
        <img
          src="https://ahmedgamalemam.github.io/dream_fly_signup/images/light-bg.png"
          alt="logo"
        />
      </div>
    </main>
  </body>
</html>
